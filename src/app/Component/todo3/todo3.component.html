<div class="container mt-4">
    <h1 class="bg-info">Todo Task3 </h1>

    <div class="row">
        <div class="col-md-5 mt-3">
            <div class="card">
                <div class="card-body">
                    <h2 class="text-center">{{isEditMode?"update Todo":"Add Todo"}}</h2>
                    <div class="form-group">
                        <label for="">Enter Todo Item</label>
                        <input type="text" class="form-control" #todoRef>
                    </div>

                    <div class="form-group">
                        <label for="">Select Status</label>
                        <select #statusRef class="form-control">
                            <option value="">isCompleted</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <button mat-flat-button color="accent" class="btn-block" *ngIf="!isEditMode" (click)="AddTodo()">Add
                        Todo</button>
                    <button mat-flat-button color="accent" class="btn-block" *ngIf="isEditMode"
                        (click)="onUpdate()">Update Todo</button>
                </div>
            </div>
        </div>

        <div class=" col-md-7 mt-3">
            <div class="card">
                <div class="card-body">
                    <ul *ngIf="todosArr.length>0; else notodo">
                        <li class="list-group-item d-flex justify-content-between" *ngFor="let todo of todosArr"
                            [ngClass]="{
                            'text-success':todo.isCompleted,
                            'text-danger':!todo.isCompleted
                        }">
                            <div>
                                <input type="checkbox" [checked]="todo.isCompleted" (chnge)="onChangeCheckBox(todo)">
                                {{todo.item}}
                            </div>

                            <div>
                                <button mat-mini-fab color="primary" aria-label="Example icon button with a delete icon"
                                    (click)="onEdit(todo)" class="mr-3">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-mini-fab color="warn" aria-label="Example icon button with a delete icon"
                                    (click)="onRemove(todo)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                        </li>
                    </ul>
                </div>
                <ng-template #notodo>
                    <p class="alert alert-primary ">No Todo Found in Todo List</p>
                </ng-template>
            </div>
        </div>
    </div>
</div>
